<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishore Gandhi | Press Start</title>
<meta name="description" content="Kishore Gandhi - a hero's journey through Hollywood legends.">
<style>
  :root {
    --neon: #00f0ff;
    --pink: #ff2e88;
    --gold: #ffd166;
    --bg: #07060f;
    --panel: rgba(16, 14, 34, 0.75);
    --text: #e9e8ff;
    --muted: #8d8ab3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1b1046 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
  }
  canvas#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
  }

  /* Start screen */
  #start {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
    background: var(--bg); transition: opacity 0.8s ease, visibility 0.8s;
  }
  #start.gone { opacity: 0; visibility: hidden; }
  .start-inner { text-align: center; }
  .start-title {
    font-family: "Impact", "Arial Black", sans-serif; font-size: clamp(42px, 9vw, 96px);
    letter-spacing: 4px; margin: 0; color: #fff;
    text-shadow: 0 0 18px var(--neon), 0 0 42px var(--pink);
  }
  .blink { margin-top: 36px; font-size: 20px; letter-spacing: 6px; color: var(--gold); animation: blink 1.1s steps(2) infinite; background: none; border: 0; cursor: pointer; font-family: inherit; }
  @keyframes blink { 50% { opacity: 0.15; } }

  /* HUD */
  .hud {
    position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; font-family: "Courier New", monospace; font-size: 13px; letter-spacing: 2px; color: var(--muted);
  }
  .hud b { color: var(--gold); font-size: 15px; }
  .hud .lvl { color: var(--neon); }

  main { position: relative; z-index: 2; max-width: 1100px; margin: 0 auto; padding: 20px 22px 60px; }

  .hero { text-align: center; padding: 40px 0 30px; }
  .name {
    font-family: "Impact", "Arial Black", sans-serif; font-size: clamp(44px, 8vw, 88px);
    margin: 0; letter-spacing: 3px; line-height: 1;
    background: linear-gradient(90deg, var(--neon), #fff 45%, var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(0,240,255,0.35));
  }
  .sub { margin: 14px 0 26px; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; font-size: 13px; }
  .btn {
    display: inline-block; padding: 16px 30px; border: 2px solid var(--neon); color: var(--neon);
    text-decoration: none; font-family: "Courier New", monospace; font-weight: bold; letter-spacing: 3px;
    background: rgba(0,240,255,0.06); box-shadow: 0 0 22px rgba(0,240,255,0.35), inset 0 0 18px rgba(0,240,255,0.15);
    transition: transform 0.2s, background 0.2s, color 0.2s;
  }
  .btn:hover { background: var(--neon); color: var(--bg); transform: translateY(-3px) scale(1.03); }
  .btn small { display: block; font-size: 11px; letter-spacing: 1px; opacity: 0.8; margin-top: 4px; word-break: break-all; }

  .section-title {
    text-align: center; font-family: "Impact", sans-serif; letter-spacing: 4px; font-size: 22px;
    color: var(--gold); margin: 50px 0 22px;
  }
  .section-title::before, .section-title::after { content: " ◆ "; color: var(--pink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .card {
    perspective: 900px; height: 280px; cursor: pointer; outline: none;
  }
  .card-in {
    position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .card.flip .card-in { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    padding: 20px; display: flex; flex-direction: column; border: 2px solid var(--c, var(--neon));
    background: var(--panel); box-shadow: 0 0 20px -6px var(--c, var(--neon));
  }
  .back { transform: rotateY(180deg); background: linear-gradient(160deg, rgba(40,20,80,0.95), rgba(10,8,25,0.95)); }
  .badge {
    width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
    font-family: "Impact", sans-serif; font-size: 34px; color: #fff; letter-spacing: 1px;
    background: radial-gradient(circle at 30% 30%, #fff3, transparent 60%), var(--c);
    box-shadow: 0 0 26px var(--c);
  }
  .char { font-family: "Impact", sans-serif; font-size: 20px; text-align: center; margin: 0; letter-spacing: 1px; }
  .movie { text-align: center; color: var(--c); font-size: 13px; margin: 4px 0 auto; text-transform: uppercase; letter-spacing: 1.5px; }
  .stat { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: 10px; text-transform: uppercase; }
  .bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c), #fff); transition: width 1s ease; }
  .card.flip .bar i { width: var(--w); }
  .back h4 { margin: 0 0 8px; font-family: "Impact", sans-serif; letter-spacing: 1px; color: var(--c); font-size: 18px; }
  .back p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text); }
  .hint { margin-top: auto; font-size: 11px; color: var(--muted); text-align: center; letter-spacing: 1px; }

  .footer { text-align: center; margin-top: 60px; color: var(--muted); font-family: "Courier New", monospace; font-size: 12px; letter-spacing: 2px; }
  .footer b { color: var(--gold); }

  @media (max-width: 600px) {
    .hud { font-size: 11px; padding: 14px; }
    .card { height: 260px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="start">
  <div class="start-inner">
    <h1 class="start-title">KISHORE<br>GANDHI</h1>
    <button class="blink" id="startBtn">PRESS START</button>
  </div>
</div>

<div class="hud">
  <span>PLAYER 1 · <b>KISHORE</b></span>
  <span class="lvl">LEVEL 99</span>
  <span>SCORE <b id="score">000000</b></span>
</div>

<main>
  <section class="hero">
    <h2 class="name">KISHORE GANDHI</h2>
    <p class="sub">Choose your hero · Insert coin</p>
    <a class="btn" href="https://linkedin.com/in/kishoregandhidevops" target="_blank" rel="noopener">
      CONNECT ON LINKEDIN
      <small>linkedin.com/in/kishoregandhidevops</small>
    </a>
  </section>

  <h3 class="section-title">HALL OF LEGENDS</h3>
  <div class="grid" id="grid"></div>

  <p class="footer">&copy; <span id="year"></span> <b>KISHORE GANDHI</b> · CONTINUE? 9 8 7 6 5 4 3 2 1</p>
</main>

<script>
(function () {
  // Hollywood legends (fictional characters). Taglines are original.
  var LEGENDS = [
    { name: "Tony Stark",      movie: "Iron Man",                    c: "#ff3b3b", ini: "IM", power: 96, tag: "Genius, billionaire, playboy, philanthropist. Builds his way out of every problem." },
    { name: "Neo",             movie: "The Matrix",                  c: "#00ff9c", ini: "NE", power: 94, tag: "Sees the code behind everything. Dodges bullets by believing." },
    { name: "Jack Sparrow",    movie: "Pirates of the Caribbean",    c: "#ffb020", ini: "JS", power: 88, tag: "Captain of questionable plans and a compass that points wherever he wants." },
    { name: "Darth Vader",     movie: "Star Wars",                   c: "#c0c8d8", ini: "DV", power: 92, tag: "Commands the Force, breathes like a storm, and never misses a meeting." },
    { name: "Indiana Jones",   movie: "Raiders of the Lost Ark",     c: "#d08a3c", ini: "IJ", power: 86, tag: "Archaeologist with a whip, a fedora and a strong dislike for snakes." },
    { name: "James Bond",      movie: "007",                         c: "#4a90ff", ini: "JB", power: 90, tag: "Licensed to ship. Shaken, never stirred, always on time." },
    { name: "Rocky Balboa",    movie: "Rocky",                       c: "#e8c04a", ini: "RB", power: 85, tag: "Never gives up. Climbs every staircase, one rep at a time." },
    { name: "Forrest Gump",    movie: "Forrest Gump",                c: "#7ddc6b", ini: "FG", power: 80, tag: "Just keeps running. Turns up in every chapter of history." },
    { name: "Gandalf",         movie: "The Lord of the Rings",       c: "#b89cff", ini: "GF", power: 93, tag: "You shall not pass. Wizard, guide, and fireworks specialist." },
    { name: "Ellen Ripley",    movie: "Alien",                       c: "#ff8a3d", ini: "ER", power: 89, tag: "Survivor. Keeps calm, keeps the crew alive, and keeps the cat." },
    { name: "Maximus",         movie: "Gladiator",                   c: "#ff5577", ini: "MX", power: 91, tag: "Loyal, fearless, and undefeated in the arena of production." },
    { name: "Wolverine",       movie: "X-Men",                       c: "#ffe066", ini: "WV", power: 90, tag: "Self-healing, fierce, and always ready to take a hit for the team." },
    { name: "The Dark Knight", movie: "Batman Begins",               c: "#5a5aff", ini: "BK", power: 95, tag: "Prepared for every scenario. Works in the shadows, saves the city." },
    { name: "T-800",           movie: "The Terminator",              c: "#ff4d4d", ini: "T8", power: 87, tag: "Relentless. Will not stop until the job is done. Also, he is back." },
    { name: "Maverick",        movie: "Top Gun",                     c: "#3ee0ff", ini: "MV", power: 84, tag: "Takes the fastest jet, flies the closest line, and rides the thrill." },
    { name: "Vito Corleone",   movie: "The Godfather",               c: "#c9a227", ini: "VC", power: 92, tag: "Makes offers you cannot refuse. Patient, precise, and respected." }
  ];

  // Build cards
  var grid = document.getElementById('grid');
  LEGENDS.forEach(function (h) {
    var el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    el.style.setProperty('--c', h.c);
    el.style.setProperty('--w', h.power + '%');
    el.innerHTML =
      '<div class="card-in">' +
        '<div class="face front">' +
          '<div class="badge">' + h.ini + '</div>' +
          '<p class="char">' + h.name + '</p>' +
          '<p class="movie">' + h.movie + '</p>' +
          '<div class="stat">Power <span style="float:right">' + h.power + '</span></div>' +
          '<div class="bar"><i></i></div>' +
          '<div class="hint">CLICK TO FLIP</div>' +
        '</div>' +
        '<div class="face back">' +
          '<h4>' + h.name + '</h4>' +
          '<p>' + h.tag + '</p>' +
          '<div class="hint">FROM ' + h.movie.toUpperCase() + '</div>' +
        '</div>' +
      '</div>';
    grid.appendChild(el);
  });

  var score = 0;
  var scoreEl = document.getElementById('score');
  function addScore(n) { score += n; scoreEl.textContent = String(score).padStart(6, '0'); }

  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    var wasFlipped = card.classList.contains('flip');
    card.classList.toggle('flip');
    if (!wasFlipped) addScore(100);
  });
  grid.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
      e.preventDefault(); e.target.click();
    }
  });

  // Start screen
  var start = document.getElementById('start');
  document.getElementById('startBtn').addEventListener('click', function () {
    start.classList.add('gone');
    addScore(1000);
  });

  // Starfield
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var stars = [];
  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    stars = [];
    var n = Math.floor(canvas.width * canvas.height / 5000);
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                   z: Math.random() * 1.2 + 0.2, r: Math.random() * 1.4 + 0.3 });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.z * 0.35;
      if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      ctx.globalAlpha = 0.35 + s.z * 0.4;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) draw();

  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
